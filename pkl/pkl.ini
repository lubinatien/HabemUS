[pkl]

; The layout ini file is "layouts/[key value]/layout.ini"
layout = habemus:HabemUS

; Switch between layouts (only useful with several layouts above)
changeLayoutHotkey =

; Dead keys of the Windows layout PKL runs on top of ("auto" detects them).
; With the plain "US" Windows layout there are none.
systemsDeadkeys = auto

; Try another way of sending non-ASCII characters if some program
; shows the wrong characters (see nonASCII.ini)
changeNonASCIIMode = #F12

; A file name in the languages folder (without .ini), or auto
language = auto

; HabemUS has no help images (state0.png...), so keep this off
displayHelpImage = no
displayHelpImageHotkey = #F1

; Exit the application
exitAppHotkey =

; Suspend (disable/enable) the layout: press both Alt keys
suspendHotkey = LAlt & RAlt,RAlt & LAlt

; Every file next to pkl.exe instead of in layouts\habemus
compactMode = no

; Treat Ctrl+Alt as AltGr (for keyboards without a right Alt key)
altGrEqualsAltCtrl = no

; Minutes of inactivity before suspending / exiting (0 = never)
suspendTimeOut = 0
exitTimeOut = 0

startsInSuspendMode = no
